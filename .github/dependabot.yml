# Opens a pull request when a dependency or a pinned GitHub Action has an update.
# Monthly and grouped, so it stays quiet. (Security alerts still show up right away in the
# repo's Security tab.)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
